<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Previsão do Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="watermark-bg" aria-hidden="true" id="watermarkBg"></div>

<div class="app">

  <header class="hero">
    <h1>Previsão do Tempo</h1>
    <p class="subtitle">Consulte a previsão dos próximos dias ou o clima atual de qualquer cidade do mundo.</p>
  </header>

  <section class="search-panel">
    <div class="field">
      <label for="cityInput">Cidade</label>
      <div class="combobox" id="cityCombobox">
        <input
          type="text" id="cityInput" autocomplete="off"
          placeholder="Digite o nome da cidade..."
          role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="cityList" />
        <ul class="combobox-list" id="cityList" role="listbox" hidden></ul>
      </div>
    </div>

    <div class="field">
      <label for="daysInput">Dias</label>
      <div class="combobox" id="daysCombobox">
        <input type="text" id="daysInput" autocomplete="off" readonly
          placeholder="1 a 14" role="combobox" aria-expanded="false" aria-controls="daysList" />
        <ul class="combobox-list" id="daysList" role="listbox" hidden></ul>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnBuscar">Buscar</button>
      <button class="btn btn-secondary" id="btnAtual">Buscar clima atual</button>
    </div>
  </section>

  <p class="status-line" id="statusLine" hidden></p>
  <div class="error-box" id="errorBox" hidden>
    <span id="errorText"></span>
    <button id="btnDemo">Ver com dados de exemplo</button>
  </div>
  <p class="demo-banner" id="demoBanner" hidden>Exibindo dados de exemplo — o backend não respondeu.</p>

  <section class="results" id="results" hidden>
    <div class="location-line" id="locationLine"></div>
    <div class="forecast-grid" id="forecastGrid"></div>
  </section>

  <footer class="app-footer">Victor Yudi Ogusuko</footer>
</div>

<script src="js/icons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
